[project]
name = "venice-ai-home-assistant"
version = "2.0.0"
requires-python = ">=3.13"

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component",
    "openai>=1.93.3",
    "sentence-stream>=1.1.0",
    "voluptuous-openapi>=0.0.4",
    # Requirements of the Home Assistant components this integration loads
    "ha-ffmpeg",
    "hassil",
    "home-assistant-intents",
    "mutagen",
    "pymicro-vad",
    "pyspeex-noise",
    "PyTurboJPEG",
    "black",
    "mypy",
    "pylint",
    "pyright",
    "ruff",
]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true

[tool.mypy]
python_version = "3.13"
files = ["custom_components/venice_ai", "tests"]
explicit_package_bases = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["voluptuous_openapi.*", "pytest_homeassistant_custom_component.*"]
ignore_missing_imports = true

[tool.pyright]
include = ["custom_components", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "standard"
# Home Assistant declares entity attributes as cached properties
reportIncompatibleVariableOverride = false

[tool.pylint.main]
py-version = "3.13"
ignore-paths = ["^\\.venv/.*$"]

# Mirrors the Home Assistant core pylint setup: checks covered by ruff,
# black or mypy are disabled here.
[tool.pylint."messages control"]
disable = [
    "format",
    "abstract-method",
    "broad-exception-caught",
    "cyclic-import",
    "duplicate-code",
    "fixme",
    "import-outside-toplevel",
    "inconsistent-return-statements",
    "invalid-name",
    "missing-class-docstring",
    "missing-function-docstring",
    "missing-module-docstring",
    "no-else-return",
    "possibly-used-before-assignment",
    "protected-access",
    "superfluous-parens",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-branches",
    "too-many-instance-attributes",
    "too-many-lines",
    "too-many-locals",
    "too-many-nested-blocks",
    "too-many-positional-arguments",
    "too-many-return-statements",
    "too-many-statements",
    "try-except-raise",
    "unexpected-keyword-arg",
    "unused-argument",
    "unused-import",
    "wrong-import-order",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
